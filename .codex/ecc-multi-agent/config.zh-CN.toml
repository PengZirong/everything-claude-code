#:schema https://developers.openai.com/codex/config-schema.json

# ECC Codex multi-agent role pack
# Merge these tables into `.codex/config.toml` or use this file as a reference.
# Copy the selected role TOMLs into `.codex/agents/` before using these snippets.
# `config_file` paths are intentionally copy-ready for end-user setups.

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents."a11y-architect"]
description = "Accessibility Architect specializing in WCAG 2.2 compliance for Web and Native platforms. Use PROACTIVELY when designing UI components, establishing design systems, or auditing code for inclusive user experiences."
config_file = "agents/a11y-architect.toml"

[agents."agent-evaluator"]
description = "Evaluates agent output against 5-axis quality rubric (accuracy, completeness, clarity, actionability, conciseness). Use after any non-trivial task when the user wants a quality assessment, or when the agent-self-evaluation skill is active. Produces structured scorecard with evidence and improvement suggestions."
config_file = "agents/agent-evaluator.toml"

[agents."architect"]
description = "软件架构专家，专注于系统设计、可扩展性和技术决策。在规划新功能、重构大型系统或进行架构决策时，主动使用。"
config_file = "agents/architect.toml"

[agents."build-error-resolver"]
description = "构建和TypeScript错误解决专家。在构建失败或类型错误发生时主动使用。仅以最小差异修复构建/类型错误，不进行架构编辑。专注于快速使构建通过。"
config_file = "agents/build-error-resolver.toml"

[agents."chief-of-staff"]
description = "个人通讯首席参谋，负责筛选电子邮件、Slack、LINE和Messenger中的消息。将消息分为4个等级（跳过/仅信息/会议信息/需要行动），生成草稿回复，并通过钩子强制执行发送后的跟进。适用于管理多渠道通讯工作流程时。"
config_file = "agents/chief-of-staff.toml"

[agents."code-architect"]
description = "通过分析现有代码库的模式和约定来设计功能架构，然后提供包含具体文件、接口、数据流和构建顺序的实现蓝图。"
config_file = "agents/code-architect.toml"

[agents."code-explorer"]
description = "通过追踪执行路径、映射架构层和记录依赖关系，深入分析现有代码库功能，为新的开发提供信息。"
config_file = "agents/code-explorer.toml"

[agents."code-reviewer"]
description = "专业代码审查专家。主动审查代码的质量、安全性和可维护性。在编写或修改代码后立即使用。所有代码变更必须使用。"
config_file = "agents/code-reviewer.toml"

[agents."code-simplifier"]
description = "简化并优化代码，以提高清晰度、一致性和可维护性，同时保持行为不变。除非另有指示，否则重点关注最近修改的代码。"
config_file = "agents/code-simplifier.toml"

[agents."comment-analyzer"]
description = "分析代码注释的准确性、完整性、可维护性和注释腐烂风险。"
config_file = "agents/comment-analyzer.toml"

[agents."conversation-analyzer"]
description = "使用此代理分析对话记录，以找到值得通过钩子预防的行为。由不带参数的 /hookify 触发。"
config_file = "agents/conversation-analyzer.toml"

[agents."cpp-build-resolver"]
description = "C++构建、CMake和编译错误解决专家。以最小改动修复构建错误、链接器问题和模板错误。在C++构建失败时使用。"
config_file = "agents/cpp-build-resolver.toml"

[agents."cpp-reviewer"]
description = "专注于内存安全、现代C++惯用法、并发和性能的C++代码评审专家。适用于所有C++代码变更。C++项目必须使用。"
config_file = "agents/cpp-reviewer.toml"

[agents."csharp-reviewer"]
description = "精通C#代码审查，专注于.NET约定、异步模式、安全性、可空引用类型和性能。适用于所有C#代码更改。必须用于C#项目。"
config_file = "agents/csharp-reviewer.toml"

[agents."dart-build-resolver"]
description = "Dart/Flutter构建、分析和依赖错误解决专家。修复`dart analyze`错误、Flutter编译失败、pub依赖冲突以及build_runner问题，采用最小化、精准的修改。当Dart/Flutter构建失败时使用。"
config_file = "agents/dart-build-resolver.toml"

[agents."database-reviewer"]
description = "PostgreSQL 数据库专家，专注于查询优化、模式设计、安全性和性能。在编写 SQL、创建迁移、设计模式或排查数据库性能问题时，请主动使用。融合了 Supabase 最佳实践。"
config_file = "agents/database-reviewer.toml"

[agents."django-build-resolver"]
description = "Django/Python build, migration, and dependency error resolution specialist. Fixes pip/Poetry errors, migration conflicts, import errors, Django configuration issues, and collectstatic failures with minimal changes. Use when Django setup or startup fails."
config_file = "agents/django-build-resolver.toml"

[agents."django-reviewer"]
description = "Expert Django code reviewer specializing in ORM correctness, DRF patterns, migration safety, security misconfigurations, and production-grade Django practices. Use for all Django code changes. MUST BE USED for Django projects."
config_file = "agents/django-reviewer.toml"

[agents."doc-updater"]
description = "文档和代码映射专家。主动用于更新代码映射和文档。运行 /update-codemaps 和 /update-docs，生成 docs/CODEMAPS/*，更新 README 和指南。"
config_file = "agents/doc-updater.toml"

[agents."docs-lookup"]
description = "当用户询问如何使用库、框架或API，或需要最新的代码示例时，使用Context7 MCP获取当前文档，并返回带有示例的答案。针对文档/API/设置问题调用。"
config_file = "agents/docs-lookup.toml"

[agents."e2e-runner"]
description = "使用Vercel Agent Browser（首选）和Playwright备选方案进行端到端测试的专家。主动用于生成、维护和运行E2E测试。管理测试流程，隔离不稳定的测试，上传工件（截图、视频、跟踪），并确保关键用户流程正常运行。"
config_file = "agents/e2e-runner.toml"

[agents."fastapi-reviewer"]
description = "Reviews FastAPI applications for async correctness, dependency injection, Pydantic schemas, security, OpenAPI quality, testing, and production readiness."
config_file = "agents/fastapi-reviewer.toml"

[agents."flutter-reviewer"]
description = "Flutter和Dart代码审查员。审查Flutter代码，关注小部件最佳实践、状态管理模式、Dart惯用法、性能陷阱、可访问性和清洁架构违规。库无关——适用于任何状态管理解决方案和工具。"
config_file = "agents/flutter-reviewer.toml"

[agents."fsharp-reviewer"]
description = "Expert F# code reviewer specializing in functional idioms, type safety, pattern matching, computation expressions, and performance. Use for all F# code changes. MUST BE USED for F# projects."
config_file = "agents/fsharp-reviewer.toml"

[agents."gan-evaluator"]
description = "GAN Harness — Evaluator agent. Tests the live running application via Playwright, scores against rubric, and provides actionable feedback to the Generator."
config_file = "agents/gan-evaluator.toml"

[agents."gan-generator"]
description = "GAN Harness — Generator agent. Implements features according to the spec, reads evaluator feedback, and iterates until quality threshold is met."
config_file = "agents/gan-generator.toml"

[agents."gan-planner"]
description = "GAN Harness — Planner agent. Expands a one-line prompt into a full product specification with features, sprints, evaluation criteria, and design direction."
config_file = "agents/gan-planner.toml"

[agents."go-build-resolver"]
description = "Go 构建、vet 和编译错误解决专家。以最小改动修复构建错误、go vet 问题和 linter 警告。在 Go 构建失败时使用。"
config_file = "agents/go-build-resolver.toml"

[agents."go-reviewer"]
description = "专业的Go代码审查专家，专注于地道Go语言、并发模式、错误处理和性能优化。适用于所有Go代码变更。必须用于Go项目。"
config_file = "agents/go-reviewer.toml"

[agents."harmonyos-app-resolver"]
description = "HarmonyOS application development expert specializing in ArkTS and ArkUI. Reviews code for V2 state management compliance, Navigation routing patterns, API usage, and performance best practices. Use for HarmonyOS/OpenHarmony projects."
config_file = "agents/harmonyos-app-resolver.toml"

[agents."harness-optimizer"]
description = "分析并改进本地代理工具配置以提高可靠性、降低成本并增加吞吐量。"
config_file = "agents/harness-optimizer.toml"

[agents."healthcare-reviewer"]
description = "Reviews healthcare application code for clinical safety, CDSS accuracy, PHI compliance, and medical data integrity. Specialized for EMR/EHR, clinical decision support, and health information systems."
config_file = "agents/healthcare-reviewer.toml"

[agents."homelab-architect"]
description = "Designs home and small-lab network plans from hardware inventory, goals, and operator experience level, with safe staged changes and rollback guidance."
config_file = "agents/homelab-architect.toml"

[agents."java-build-resolver"]
description = "Java/Maven/Gradle构建、编译和依赖错误解决专家。修复构建错误、Java编译器错误以及Maven/Gradle问题，改动最小。适用于Java或Spring Boot构建失败时。"
config_file = "agents/java-build-resolver.toml"

[agents."java-reviewer"]
description = "专业的Java和Spring Boot代码审查专家，专注于分层架构、JPA模式、安全性和并发性。适用于所有Java代码变更。Spring Boot项目必须使用。"
config_file = "agents/java-reviewer.toml"

[agents."kotlin-build-resolver"]
description = "Kotlin/Gradle 构建、编译和依赖错误解决专家。以最小改动修复构建错误、Kotlin 编译器错误和 Gradle 问题。适用于 Kotlin 构建失败时。"
config_file = "agents/kotlin-build-resolver.toml"

[agents."kotlin-reviewer"]
description = "Kotlin 和 Android/KMP 代码审查员。审查 Kotlin 代码以检查惯用模式、协程安全性、Compose 最佳实践、违反清洁架构原则以及常见的 Android 陷阱。"
config_file = "agents/kotlin-reviewer.toml"

[agents."loop-operator"]
description = "操作自主代理循环，监控进度，并在循环停滞时安全地进行干预。"
config_file = "agents/loop-operator.toml"

[agents."marketing-agent"]
description = "Marketing strategist and copywriter for campaign planning, audience research, positioning, copy creation, and content review. Covers landing pages, email sequences, social posts, ad copy, short-form video scripts, and content calendars. Use when the user wants to plan or execute a product launch or marketing campaign."
config_file = "agents/marketing-agent.toml"

[agents."mle-reviewer"]
description = "Production machine-learning engineering reviewer for data contracts, feature pipelines, training reproducibility, offline/online evaluation, model serving, monitoring, and rollback. Use when ML, MLOps, model training, inference, feature store, or evaluation code changes."
config_file = "agents/mle-reviewer.toml"

[agents."network-architect"]
description = "Designs enterprise or multi-site network architecture from requirements, using existing network skills for focused routing, validation, automation, and troubleshooting detail."
config_file = "agents/network-architect.toml"

[agents."network-config-reviewer"]
description = "Reviews router and switch configurations for security, correctness, stale references, risky change-window commands, and missing operational guardrails."
config_file = "agents/network-config-reviewer.toml"

[agents."network-troubleshooter"]
description = "Diagnoses network connectivity, routing, DNS, interface, and policy symptoms with a read-only OSI-layer workflow and evidence-backed root cause summary."
config_file = "agents/network-troubleshooter.toml"

[agents."opensource-forker"]
description = "分叉任何项目以进行开源。复制文件，剥离机密和凭据（20多种模式），用占位符替换内部引用，生成.env.example，并清理git历史。这是opensource-pipeline技能的第一阶段。"
config_file = "agents/opensource-forker.toml"

[agents."opensource-packager"]
description = "为经过清理的项目生成完整的开源打包文件。生成 CLAUDE.md、setup.sh、README.md、LICENSE、CONTRIBUTING.md 和 GitHub 问题模板。使任何仓库都能立即与 Claude Code 配合使用。这是 opensource-pipeline 技能的第三阶段。"
config_file = "agents/opensource-packager.toml"

[agents."opensource-sanitizer"]
description = "在发布前验证开源分支是否已完全清理。使用20多种正则表达式模式扫描泄露的密钥、个人身份信息、内部引用和危险文件。生成通过/失败/通过但有警告的报告。这是opensource-pipeline技能的第二阶段。在任何公开发布前主动使用。"
config_file = "agents/opensource-sanitizer.toml"

[agents."performance-optimizer"]
description = "性能分析与优化专家。主动用于识别瓶颈、优化慢速代码、减小打包体积以及提升运行时性能。涵盖性能剖析、内存泄漏、渲染优化和算法改进。"
config_file = "agents/performance-optimizer.toml"

[agents."php-reviewer"]
description = "Expert PHP code reviewer specializing in PSR-12 compliance, PHP type system, Eloquent ORM patterns, security, and performance. Use for all PHP code changes. MUST BE USED for PHP projects."
config_file = "agents/php-reviewer.toml"

[agents."planner"]
description = "复杂功能和重构的专家规划专家。当用户请求功能实现、架构变更或复杂重构时，请主动使用。计划任务自动激活。"
config_file = "agents/planner.toml"

[agents."pr-test-analyzer"]
description = "审查拉取请求的测试覆盖质量和完整性，重点在于行为覆盖和实际缺陷预防。"
config_file = "agents/pr-test-analyzer.toml"

[agents."python-reviewer"]
description = "专业的Python代码审查员，专精于PEP 8合规性、Pythonic惯用法、类型提示、安全性和性能。适用于所有Python代码变更。必须用于Python项目。"
config_file = "agents/python-reviewer.toml"

[agents."pytorch-build-resolver"]
description = "PyTorch运行时、CUDA和训练错误解决专家。修复张量形状不匹配、设备错误、梯度问题、DataLoader问题和混合精度失败，改动最小。在PyTorch训练或推理崩溃时使用。"
config_file = "agents/pytorch-build-resolver.toml"

[agents."react-build-resolver"]
description = "Diagnose and fix React build failures across Vite, webpack, Next.js, CRA, Parcel, esbuild, and Bun. Handles JSX/TSX compile errors, hydration mismatches, server/client component boundary failures, missing types, and bundler-specific configuration issues with minimal, surgical changes. MUST BE USED when a React build fails."
config_file = "agents/react-build-resolver.toml"

[agents."react-reviewer"]
description = "Expert React/JSX code reviewer specializing in hook correctness, render performance, server/client component boundaries, accessibility, and React-specific security. Use for any change touching .tsx/.jsx files or React component logic. MUST BE USED for React projects."
config_file = "agents/react-reviewer.toml"

[agents."refactor-cleaner"]
description = "死代码清理与整合专家。主动用于移除未使用代码、重复项和重构。运行分析工具（knip、depcheck、ts-prune）识别死代码并安全移除。"
config_file = "agents/refactor-cleaner.toml"

[agents."rust-build-resolver"]
description = "Rust构建、编译和依赖错误解决专家。修复cargo构建错误、借用检查器问题和Cargo.toml问题，改动最小。适用于Rust构建失败时。"
config_file = "agents/rust-build-resolver.toml"

[agents."rust-reviewer"]
description = "专业的Rust代码审查员，专精于所有权、生命周期、错误处理、不安全代码使用和惯用模式。适用于所有Rust代码变更。Rust项目必须使用。"
config_file = "agents/rust-reviewer.toml"

[agents."security-reviewer"]
description = "安全漏洞检测与修复专家。在编写处理用户输入、身份验证、API端点或敏感数据的代码后主动使用。标记密钥、SSRF、注入、不安全的加密以及OWASP Top 10漏洞。"
config_file = "agents/security-reviewer.toml"

[agents."seo-specialist"]
description = "SEO专家，负责技术SEO审计、页面优化、结构化数据、核心网页指标以及内容/关键词映射。用于网站审计、元标签审查、架构标记、站点地图和robots问题以及SEO修复计划。"
config_file = "agents/seo-specialist.toml"

[agents."silent-failure-hunter"]
description = "审查代码中的静默失败、吞没错误、不良回退以及缺失的错误传播。"
config_file = "agents/silent-failure-hunter.toml"

[agents."spec-miner"]
description = "Extracts behavioral specs from existing codebases for OpenSpec. Produces flat Requirement and Invariant blocks with structured metadata (entities, enforced, id, test anchors). Outputs openspec/specs/<capability>/spec.md. Fully self-bootstrapping — no dependency on codebase-onboarding. Use when onboarding a brownfield project to spec-driven development."
config_file = "agents/spec-miner.toml"

[agents."swift-build-resolver"]
description = "Swift/Xcode build, compilation, and dependency error resolution specialist. Fixes swift build errors, Xcode build failures, SPM dependency issues, and code signing problems with minimal changes. Use when Swift builds fail."
config_file = "agents/swift-build-resolver.toml"

[agents."swift-reviewer"]
description = "Expert Swift code reviewer specializing in protocol-oriented design, value semantics, ARC memory management, Swift Concurrency, and idiomatic patterns. Use for all Swift code changes. MUST BE USED for Swift projects."
config_file = "agents/swift-reviewer.toml"

[agents."tdd-guide"]
description = "测试驱动开发专家，强制执行先写测试的方法论。在编写新功能、修复错误或重构代码时主动使用。确保80%以上的测试覆盖率。"
config_file = "agents/tdd-guide.toml"

[agents."type-design-analyzer"]
description = "分析封装、不变式表达、实用性和强制性的类型设计。"
config_file = "agents/type-design-analyzer.toml"

[agents."typescript-reviewer"]
description = "专业的TypeScript/JavaScript代码审查专家，专注于类型安全、异步正确性、Node/Web安全以及惯用模式。适用于所有TypeScript和JavaScript代码变更。在TypeScript/JavaScript项目中必须使用。"
config_file = "agents/typescript-reviewer.toml"

[agents."vue-reviewer"]
description = "Expert Vue.js code reviewer specializing in Composition API correctness, reactivity pitfalls, component architecture, template security, and Vue-specific performance. Use for any change touching .vue, .ts/.js files with Vue imports, or Vue ecosystem code (Pinia, Vue Router, Nuxt). MUST BE USED for Vue projects."
config_file = "agents/vue-reviewer.toml"
