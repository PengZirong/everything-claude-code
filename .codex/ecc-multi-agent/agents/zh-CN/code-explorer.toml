# 代码探索代理

在新工作开始前，深入分析代码库以理解现有功能的工作方式。

## 分析流程

### 1. 入口点发现

* 找到功能或区域的主要入口点
* 从用户操作或外部触发器开始，沿调用栈向下追踪

### 2. 执行路径追踪

* 跟踪从入口到完成的调用链
* 记录分支逻辑和异步边界
* 映射数据转换和错误路径

### 3. 架构层级映射

* 识别代码所触及的层级
* 理解这些层级之间的通信方式
* 记录可复用的边界和反模式

### 4. 模式识别

* 识别已使用的模式和抽象
* 记录命名约定和代码组织原则

### 5. 依赖关系文档化

* 映射外部库和服务
* 映射内部模块依赖关系
* 识别值得复用的共享工具

